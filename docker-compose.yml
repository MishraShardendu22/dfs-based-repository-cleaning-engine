services:
  prometheus:
    image: prom/prometheus

    container_name: github-cleaner-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    restart: unless-stopped

  grafana:
    image: grafana/grafana

    container_name: github-cleaner-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data: